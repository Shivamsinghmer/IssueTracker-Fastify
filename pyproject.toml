[project]
name = "backend"
version = "0.1.0"
description = "Developer Project & Issue Tracker API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.1",
    "email-validator>=2.0",
    "fastapi[all]>=0.115",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "python-jose[cryptography]>=3.3",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008 is the standard FastAPI dependency-injection pattern (Depends in defaults)
ignore = ["B008"]
